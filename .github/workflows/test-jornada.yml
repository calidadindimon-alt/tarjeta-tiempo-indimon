name: Pruebas de nómina y prueba de humo

# Corre sola cada vez que se modifica index.html (push o pull request), para detectar en segundos
# si un cambio rompió el cálculo de horas o de descuentos de nómina — antes de que llegue a producción.
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'formatos/**'
      - 'scripts/regenerar-tailwind.mjs'
      - 'scripts/recordatorios-*.mjs'
      - 'service-worker.js'
      - 'firestore.rules'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'formatos/**'
      - 'scripts/regenerar-tailwind.mjs'
      - 'scripts/recordatorios-*.mjs'
      - 'service-worker.js'
      - 'firestore.rules'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar calcularJornadaDiaria()
        run: node tests/test-jornada-diaria.mjs

      - name: Probar descuento por ausencia injustificada (Art. 173 CST)
        run: node tests/test-descuento-ausencias.mjs

      - name: Probar inferencia de descanso remunerado (sábado/domingo/festivo)
        run: node tests/test-descanso-inferido.mjs

      - name: Probar las 3 tablas del export a Excel (extras, permisos, ausencias)
        run: node tests/test-excel-consolidado.mjs

      - name: Probar la clasificación de permisos (remunerados por ley, voluntarios, art. 51 y Reglamento Interno)
        run: node tests/test-permisos-clasificacion.mjs

      - name: Probar las horas en formato 24 horas de los campos de hora
        run: node tests/test-hora24.mjs

      - name: Probar la aprobación de horas extra por RRHH (solo las aprobadas entran a la nómina)
        run: node tests/test-extras-aprobacion.mjs

      - name: Probar el resumen de alertas por colaborador y mes
        run: node tests/test-resumen-alertas.mjs

      - name: Probar los recordatorios al celular (almuerzo y salida)
        run: node tests/test-recordatorios.mjs

      - name: Probar que un permiso por horas aprobado de antemano no bloquee el fichaje del día
        run: node tests/test-registro-permiso.mjs

      - name: Probar la regla de 24 horas y el horario obligatorio de los permisos
        run: node tests/test-permisos-anticipacion.mjs

      - name: Instalar librerías para probar el Excel y el PDF de permisos
        run: npm install --no-save exceljs@4.4.0 jspdf@2.5.2

      - name: Probar el Excel de permisos (formatos oficiales GH-F-011 y GH-F-012) y el PDF de la constancia
        run: node tests/test-permisos-formatos.mjs

      - name: Verificar que el CSS de Tailwind embebido en index.html no tenga clases faltantes
        run: node scripts/regenerar-tailwind.mjs --check

  # Prueba de humo: abre la app completa en un Chrome automático (con Firebase simulado, sin tocar la base real)
  # y comprueba que carga sin errores y que abren sus pantallas principales. Ver tests/test-humo.mjs.
  humo:
    # Fijo en 24.04: "ubuntu-latest" pasó a 26.04 y Playwright 1.56.1 no instala Chromium ahí.
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright y Chrome
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Abrir la app y recorrer sus pantallas principales
        run: node tests/test-humo.mjs

      - name: Guardar la captura de pantalla si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captura-prueba-de-humo
          path: tests/_humo-fallo.png
          if-no-files-found: ignore

  # Reglas de seguridad de Firestore en el emulador (sin tocar la base real): quién puede leer y escribir qué.
  reglas:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java (lo necesita el emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar el emulador y las librerías de prueba
        run: npm install --no-save firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.13.0

      - name: Probar las reglas de privacidad y que la app siga funcionando
        run: npx firebase emulators:exec --only firestore --project demo-indimon "node tests/test-reglas-firestore.mjs"
