name: Backup semanal de Firestore

# Corre solo, cada lunes muy temprano (hora Colombia), sin que nadie tenga que acordarse.
# Guarda dos copias independientes del backup: una en este repo (carpeta backups/) y otra en
# la carpeta de OneDrive del Admin — si una falla o se pierde, la otra sigue sirviendo.
#
# También se puede disparar a mano desde la pestaña "Actions" de GitHub con "Run workflow",
# por ejemplo justo antes de un cambio grande en la base de datos.
on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC = lunes 01:00 hora Colombia
  workflow_dispatch: {}

permissions:
  contents: write # necesario para poder commitear el archivo de backup nuevo en backups/

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del script
        run: npm install firebase-admin@12 --no-save

      - name: Generar backup desde Firestore
        id: backup
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/backup-firestore.mjs

      - name: Guardar el backup en este repositorio
        run: |
          git config user.name "Backup automático INDIMON"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear (el backup de hoy es idéntico al anterior)."
          else
            git commit -m "chore: backup semanal automático ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Instalar rclone
        if: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN != '' }}
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Subir copia a OneDrive
        if: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN != '' }}
        env:
          RCLONE_CONFIG_ONEDRIVE_INDIMON_TYPE: onedrive
          RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN }}
          RCLONE_CONFIG_ONEDRIVE_INDIMON_DRIVE_ID: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_DRIVE_ID }}
          RCLONE_CONFIG_ONEDRIVE_INDIMON_DRIVE_TYPE: personal
        run: |
          rclone copy "${{ steps.backup.outputs.archivo }}" \
            "onedrive_indimon:Documents/información personal tarjeta INDIMON/backups" \
            --no-traverse
          # Poda backups de más de ~100 días en OneDrive para no crecer sin control
          rclone delete "onedrive_indimon:Documents/información personal tarjeta INDIMON/backups" \
            --min-age 100d --no-traverse || true

      - name: Aviso si falta configurar OneDrive
        if: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN == '' }}
        run: echo "::warning::No se subió copia a OneDrive porque el secreto RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN todavía no está configurado. El backup en el repositorio (backups/) sí se guardó."
