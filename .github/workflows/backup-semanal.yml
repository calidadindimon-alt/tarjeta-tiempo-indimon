name: Backup semanal de Firestore

# Corre solo, cada lunes muy temprano (hora Colombia), sin que nadie tenga que acordarse.
# Sube el backup a la carpeta de OneDrive del Admin.
#
# IMPORTANTE: el backup NO se guarda en este repositorio. El repositorio es público (lo exige GitHub Pages
# gratis) y el backup trae sueldos, cédulas, incapacidades y ubicaciones: guardarlo aquí lo deja a la vista de
# cualquiera. Por lo mismo no se sube como "artifact" de GitHub Actions. backups/ está en .gitignore.
#
# También se puede disparar a mano desde la pestaña "Actions" de GitHub con "Run workflow",
# por ejemplo justo antes de un cambio grande en la base de datos.
on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC = lunes 01:00 hora Colombia
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del script
        run: npm install firebase-admin@12 --no-save

      - name: Generar backup desde Firestore
        id: backup
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/backup-firestore.mjs

      - name: Subir el backup a OneDrive
        # Nota: GitHub Actions no permite usar "secrets" directo dentro de un "if:" de YAML
        # (solo se puebla cuando el job ya está corriendo) — por eso el chequeo de si el
        # secreto existe se hace aquí adentro, en bash, en vez de en la condición del step.
        env:
          RCLONE_CONFIG_ONEDRIVE_INDIMON_TYPE: onedrive
          RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN }}
          RCLONE_CONFIG_ONEDRIVE_INDIMON_DRIVE_ID: ${{ secrets.RCLONE_CONFIG_ONEDRIVE_INDIMON_DRIVE_ID }}
          RCLONE_CONFIG_ONEDRIVE_INDIMON_DRIVE_TYPE: personal
        run: |
          if [ -z "$RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN" ]; then
            echo "::error::No se guardó el backup: falta el secreto RCLONE_CONFIG_ONEDRIVE_INDIMON_TOKEN, y OneDrive es el único lugar donde se guarda."
            exit 1
          fi
          curl https://rclone.org/install.sh | sudo bash
          rclone copy "${{ steps.backup.outputs.archivo }}" \
            "onedrive_indimon:Documents/información personal tarjeta INDIMON/backups" \
            --no-traverse
          # Poda backups de más de ~100 días en OneDrive para no crecer sin control
          rclone delete "onedrive_indimon:Documents/información personal tarjeta INDIMON/backups" \
            --min-age 100d --no-traverse || true
