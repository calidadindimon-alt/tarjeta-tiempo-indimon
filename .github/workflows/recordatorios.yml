name: Recordatorios de almuerzo y salida

# Revisa quién tiene el turno abierto y le manda al celular el recordatorio que le toque (ver
# scripts/recordatorios-turno.mjs): 5 min antes del almuerzo y de la salida, y a las 5:30 y 7:30 p. m. si olvidó
# marcar la salida. Solo llega a quien aceptó los recordatorios en la app.
#
# La dispara cron-job.org cada 5 minutos, de 10:00 a. m. a 9:55 p. m. hora Colombia (llamando a la API
# "workflow_dispatch" con un token que solo puede correr tareas de este repositorio). El "schedule" de abajo
# queda de respaldo: GitHub se salta o atrasa muchas de esas corridas, así que solo alcanza para los avisos de olvido.
#
# También se puede correr a mano desde la pestaña "Actions" → "Run workflow":
#   - con una cédula en "cedula_prueba", manda una notificación de prueba a esa persona;
#   - con "simular" marcado, solo muestra en el registro qué mandaría, sin mandar nada.
on:
  schedule:
    - cron: '7,37 15-23 * * *' # 10:07 a. m. a 6:37 p. m. hora Colombia
    - cron: '7,37 0-1 * * *'   # 7:07 p. m. a 8:37 p. m. hora Colombia
    - cron: '7 2 * * *'        # 9:07 p. m. hora Colombia
  workflow_dispatch:
    inputs:
      cedula_prueba:
        description: 'Cédula para mandar una notificación de prueba (vacío = correr normal)'
        required: false
        default: ''
      simular:
        description: 'Solo mostrar qué mandaría, sin mandar nada'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del script
        run: npm install firebase-admin@12 --no-save

      - name: Mandar recordatorios
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CEDULA_PRUEBA: ${{ inputs.cedula_prueba }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          if [ -n "$CEDULA_PRUEBA" ]; then
            node scripts/recordatorios-turno.mjs --probar "$CEDULA_PRUEBA"
          elif [ "$SIMULAR" = "true" ]; then
            node scripts/recordatorios-turno.mjs --simular
          else
            node scripts/recordatorios-turno.mjs
          fi
