    <style>
        :root { color-scheme: light dark; --fondo: #f1f5f9; --tarjeta: #ffffff; --texto: #0f172a; --suave: #475569; --azul: #2563eb; }
        @media (prefers-color-scheme: dark) { :root { --fondo: #0b1220; --tarjeta: #1e293b; --texto: #f1f5f9; --suave: #cbd5e1; --azul: #3b82f6; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--fondo); color: var(--texto); font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }
        main { background: var(--tarjeta); border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%; text-align: center;
               box-shadow: 0 10px 30px rgba(15, 23, 42, .12); }
        img { width: 72px; height: 72px; border-radius: 18px; background: #fff; padding: 4px; }
        h1 { font-size: 22px; margin: 18px 0 8px; }
        p { color: var(--suave); line-height: 1.5; margin: 0 0 22px; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px;
            background: var(--azul); color: #fff; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
